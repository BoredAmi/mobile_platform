# Values that are NOT in robot_spec.yaml but are needed for the simulation.
# Every assumption lives here (and only here) so it is easy to review and tune.
# Units: SI (m, kg, rad, s).

wheel:
  mu: 1.0                  # task requirement: mu1 = mu2 = 1.0 on the drive wheels
  joint_damping: 0.005     # N m s/rad, viscous loss in the gearbox (guess)
  joint_friction: 0.0      # N m, Coulomb friction (guess)
  # Collision shape of the drive wheels: cylinder (as in collision_suggestion) or sphere.
  # With the 40 mm wide cylinder, DART puts the floor contacts on the wheels' inner edges, so
  # the effective track width becomes 0.230 m instead of 0.270 m and in-place turns are 15 %
  # faster than wheel odometry predicts. A sphere of the wheel radius touches the floor at the
  # tyre centre line like a real (slightly crowned) tyre does.
  collision: sphere

caster:
  mu: 0.0                  # frictionless spheres (task requirement)

camera:
  # webcam.stl was modelled with the camera level (pitch 0); its visual is attached to
  # camera_link so it follows the camera_pitch argument.
  mesh_cad_pitch: 0.0
  # The lens centre (robot_spec camera.origin) lies 2 mm inside webcam.stl. A simulated camera
  # inside its own housing mesh makes Ogre2 render empty frames at some headings (18 % of frames
  # while spinning). The webcam VISUAL is moved back by this much; camera pose and TF unchanged.
  mesh_clearance: 0.005

error_injection:
  # Applied only when the xacro arg inject_errors:=true. Physically shrinks the left
  # wheel's collision cylinder; the controller still assumes the nominal radius.
  left_wheel_radius_scale: 0.985     # 1.5 % smaller

ground_truth:
  publish_rate_hz: 50.0

temperature_sensor:
  # The simulated MCP9808 samples the world's temperature field (apartment_layout.yaml
  # 'temperature') at the sensor position, with the first-order lag of
  # robot_spec temperature_sensor.time_constant_s.
  bias_stddev_c: 0.15        # constant per-run offset, drawn once (accuracy_c is the typical bound)
  noise_stddev_c: 0.03       # per sample, before quantisation to resolution_c
  default_ambient_c: 21.0    # worlds without a 'temperature' section
