# ros2_control controllers. "$(spec <key>)" values are filled from robot_spec.yaml at launch
# (jgb_rover_control.spec_params.render). Topics are remapped in the controller manager:
#   /diff_drive_controller/cmd_vel -> /cmd_vel (geometry_msgs/TwistStamped)
#   /diff_drive_controller/odom    -> /wheel/odom
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheels_per_side: 1
    wheel_separation: $(spec drive.wheel_separation)
    wheel_radius: $(spec drive.wheel_radius)
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: false          # the EKF owns odom -> base_footprint
    publish_rate: 50.0
    open_loop: false
    position_feedback: true        # integrate wheel positions (encoders), not commanded speed
    velocity_rolling_window_size: 10

    # Covariances of the published odometry (order x, y, z, roll, pitch, yaw).
    # Pose: integrated, so only used for display. Twist: what the EKF fuses.
    #   vx: 0.03 m/s std, vy: 0.01 m/s std (non-holonomic constraint), vyaw: 0.1 rad/s std
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.0009, 0.0001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    use_stamped_vel: true          # /cmd_vel is geometry_msgs/TwistStamped (as in Jazzy)
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: $(spec drive.suggested_limits.linear)
    linear.x.min_velocity: $(spec drive.suggested_limits.linear neg)
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: $(spec drive.suggested_limits.linear_accel)
    linear.x.min_acceleration: $(spec drive.suggested_limits.linear_accel neg)

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: $(spec drive.suggested_limits.angular)
    angular.z.min_velocity: $(spec drive.suggested_limits.angular neg)
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: $(spec drive.suggested_limits.angular_accel)
    angular.z.min_acceleration: $(spec drive.suggested_limits.angular_accel neg)
