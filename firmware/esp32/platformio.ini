; jgb_rover motor / IMU board firmware for a classic ESP32 dev board (ESP32-WROOM-32, "ESP32 DevKit").
;   pio run                 build   -> .pio/build/esp32dev/firmware.bin
;   pio run -t upload       build and flash over the board's USB-UART chip (no button needed)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
; boot / core logging would pollute the link on UART0
build_flags = -D CORE_DEBUG_LEVEL=0
build_src_flags = -Wall -Wextra -Wno-unused-parameter
; protocol and controller are shared with the Teensy firmware, the PC tests and the ROS plugin
lib_deps =
  symlink://../protocol
  symlink://../common
  madhephaestus/ESP32Encoder@^0.11.7
