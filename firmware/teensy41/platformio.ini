; jgb_rover motor / IMU board firmware for the Teensy 4.1 (Teensyduino core).
;   pio run                 build   -> .pio/build/teensy41/firmware.hex
;   pio run -t upload       build and flash over USB (press the button if asked)
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; USB serial only (no MIDI / HID); the product name is set in src/usb_names.c
build_flags = -D USB_SERIAL
build_src_flags = -Wall -Wextra -Wno-unused-parameter
; shared with the PC tests and the ROS plugin
lib_deps =
  symlink://../protocol
  symlink://../common
upload_protocol = teensy-cli
