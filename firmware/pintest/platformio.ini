; Wiring test for the jgb_rover Teensy 4.1 board: encoder pin levels / edge counts and an I2C scan.
; Motors stay off. Flash the real firmware (firmware/teensy41) again afterwards.
;   pio run -t upload && pio device monitor
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -D USB_SERIAL
upload_protocol = teensy-cli
monitor_speed = 115200
